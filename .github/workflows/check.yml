name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests/model.test.cjs
      - run: node tests/solar-model.test.cjs
      - run: node tests/qibla.test.cjs
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m py_compile prayer.py solar.py scripts/install.py scripts/check-qml.py scripts/check-earth.py scripts/build-shaders.py
